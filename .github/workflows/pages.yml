name: Déployer sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Activer Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # Le site ne sert que l'application : le PDF du manuel reste hors du site.
      - name: Assembler le site
        run: |
          mkdir -p _site/icons _site/data
          cp index.html manifest.webmanifest sw.js .nojekyll _site/
          cp icons/*.png _site/icons/
          cp data/omashing.json _site/data/
          ls -R _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
